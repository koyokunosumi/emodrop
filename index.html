<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>絵文字ドロップ！ (EMOJI DROP)</title>

    <!-- ▼▼▼ SNSカード（OGP）設定 ▼▼▼ -->
    <meta property="og:title" content="絵文字ドロップ！ (EMOJI DROP)">
    <meta property="og:description" content="同じ絵文字をくっつけて進化させよう！社畜モードと動物園モードが遊べるブラウザパズルゲーム！">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://koyokunosumi.github.io/emodrop/">
    <meta property="og:image" content="https://koyokunosumi.github.io/emodrop/thumbnail.png">
    <meta name="twitter:card" content="summary_large_image">
    <!-- ▲▲▲ SNSカード（OGP）設定 ▲▲▲ -->


    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        h1 {
            margin: 2px 0;
            font-size: 18px;
        }
        #header-info {
            width: 340px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            background: #2a2a2a;
            padding: 6px 10px;
            border-radius: 8px;
            border: 2px solid #444;
            box-sizing: border-box;
            z-index: 2;
        }
        .giveup-btn {
            background: #555;
            color: #fff;
            border: none;
            padding: 4px 6px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .giveup-btn:hover {
            background: #d32f2f;
        }
        #game-container {
            position: relative;
            width: 340px;
            height: 480px;
            background: #2a2a2a;
            border: 4px solid #444;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #drop-preview {
            position: absolute;
            top: 15px;
            transform: translateX(-50%);
            pointer-events: none;
            display: none;
            z-index: 5;
            text-align: center;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .hidden {
            display: none !important;
        }
        button {
            background: #ff5722;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 4px 10px rgba(255,87,34,0.4);
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
            z-index: 25;
            position: relative;
            /* タッチの邪魔をしないよう確実に設定 */
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.95);
        }
        .mode-btn {
            background: #3f51b5;
            box-shadow: 0 4px 10px rgba(63,81,181,0.4);
        }
        .result-box {
            background: #333;
            padding: 8px;
            border-radius: 8px;
            margin: 6px 0;
            max-height: 120px;
            overflow-y: auto;
            width: 100%;
        }
        .share-btn {
            background: #1da1f2;
            box-shadow: 0 4px 10px rgba(29,161,242,0.4);
        }
        .copy-btn {
            background: #4caf50;
            box-shadow: 0 4px 10px rgba(76,175,80,0.4);
        }
    </style>
</head>
<body>

    <div id="header-info">
        <span id="current-mode-label">社畜</span>
        <span>スコア: <span id="score">0</span></span>
        <span>次: <span id="next-display" style="font-size:15px;">📌</span></span>
        <button id="btn-giveup" class="giveup-btn">🏳️ ギブアップ</button>
    </div>

    <div id="game-container">
        <div id="drop-preview">📌</div>

        <div id="title-screen" class="screen">
            <h1>📦 絵文字ドロップ！</h1>
            <p style="font-size: 13px; margin-bottom: 20px;">同じ絵文字をくっつけて進化させよう！</p>
            <button id="btn-office" class="mode-btn">🖨️ 社畜モード (オフィス)</button>
            <button id="btn-animal" class="mode-btn">🦁 動物園モード (動物)</button>
        </div>

        <div id="gameover-screen" class="screen hidden">
            <h1 style="color: #ff5722; margin: 0 0 5px 0; font-size: 22px;">GAME OVER</h1>
            <p style="margin: 2px 0; font-size: 14px;">スコア: <span id="final-score" style="font-weight:bold; font-size:18px;">0</span></p>
            <div class="result-box">
                <p id="result-title" style="margin:0 0 3px 0; font-weight:bold; font-size:12px;"></p>
                <div id="result-items" style="font-size: 18px; line-height: 1.3;"></div>
            </div>
            <button id="btn-restart">🔄 もう一度遊ぶ</button>
            <div style="display: flex; gap: 5px; justify-content: center; width: 100%;">
                <button id="btn-share" class="share-btn" style="flex: 1; padding: 9px 5px; font-size: 13px;">🐦 Xでシェア</button>
                <button id="btn-copy" class="copy-btn" style="flex: 1; padding: 9px 5px; font-size: 13px;">📋 カードコピー</button>
            </div>
            <button id="btn-title" style="background:#555; padding:6px 10px; font-size:11px; margin-top:5px;">タイトルに戻る</button>
        </div>
    </div>

<script>
    const MODES = {
        office: {
            name: "社畜",
            titleText: "☕ 今日のあなたのオフィスデスク：",
            items: [
                { emoji: '📌', radius: 14, score: 2 },
                { emoji: '✏️', radius: 20, score: 4 },
                { emoji: '✂️', radius: 27, score: 8 },
                { emoji: '📏', radius: 34, score: 16 },
                { emoji: '🔋', radius: 42, score: 32 },
                { emoji: '💾', radius: 50, score: 64 },
                { emoji: '☕', radius: 58, score: 128 },
                { emoji: '💻', radius: 66, score: 256 },
                { emoji: '🖨️', radius: 76, score: 512 }
            ],
            obamaItem: { emoji: '💥', radius: 45, score: 0, isObstacle: true }
        },
        animal: {
            name: "動物園",
            titleText: "🌴 今日のあなたの動物園：",
            items: [
                { emoji: '🐜', radius: 14, score: 2 },
                { emoji: '🐛', radius: 20, score: 4 },
                { emoji: '🐌', radius: 27, score: 8 },
                { emoji: '🐸', radius: 34, score: 16 },
                { emoji: '🐰', radius: 42, score: 32 },
                { emoji: '🐱', radius: 50, score: 64 },
                { emoji: '🐶', radius: 58, score: 128 },
                { emoji: '🦁', radius: 66, score: 256 },
                { emoji: '🐘', radius: 76, score: 512 }
            ],
            obamaItem: { emoji: '💩', radius: 45, score: 0, isObstacle: true }
        }
    };

    let currentMode = 'office';
    let score = 0;
    let gameActive = false;
    let currentEmojiIndex = 0;
    let nextEmojiIndex = 0;
    let isDragging = false;
    let canDrop = true;
    let dropX = 170;

    const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
    let engine, render, runner;
    const container = document.getElementById('game-container');
    const previewEl = document.getElementById('drop-preview');
    const WIDTH = 340;
    const HEIGHT = 480;
    const DEAD_LINE = 60;

    function cleanupPhysics() {
        if (render) {
            Render.stop(render);
            if (render.canvas) render.canvas.remove();
            render.canvas = null;
            render.context = null;
            render.textures = {};
        }
        if (runner) Runner.stop(runner);
        if (engine) {
            Composite.clear(engine.world, false);
            Engine.clear(engine);
        }
        engine = null;
        render = null;
        runner = null;
    }

    function startGame(modeKey) {
        cleanupPhysics();
        currentMode = modeKey;
        document.getElementById('title-screen').classList.add('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');
        document.getElementById('current-mode-label').innerText = MODES[modeKey].name;
        
        score = 0;
        document.getElementById('score').innerText = score;
        canDrop = true;
        
        initPhysics();
        gameActive = true;
        spawnNext();
    }

    function returnToTitle() {
        gameActive = false;
        cleanupPhysics();
        previewEl.style.display = 'none';

        document.getElementById('gameover-screen').classList.add('hidden');
        document.getElementById('title-screen').classList.remove('hidden');
    }

    function restartGame() {
        startGame(currentMode);
    }

    function initPhysics() {
        engine = Engine.create();
        render = Render.create({
            element: container,
            engine: engine,
            options: {
                width: WIDTH,
                height: HEIGHT,
                wireframes: false,
                background: '#2a2a2a'
            }
        });

        Events.on(render, 'afterRender', () => {
            if (!render || !render.context) return;
            const ctx = render.context;
            ctx.beginPath();
            ctx.moveTo(0, DEAD_LINE);
            ctx.lineTo(WIDTH, DEAD_LINE);
            ctx.strokeStyle = '#ff5722';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        });

        Render.run(render);
        runner = Runner.create();
        Runner.run(runner, engine);

        const wallOptions = { isStatic: true, render: { fillStyle: '#444' } };
        const ground = Bodies.rectangle(WIDTH / 2, HEIGHT + 25, WIDTH, 50, wallOptions);
        const leftWall = Bodies.rectangle(-25, HEIGHT / 2, 50, HEIGHT, wallOptions);
        const rightWall = Bodies.rectangle(WIDTH + 25, HEIGHT / 2, 50, HEIGHT, wallOptions);

        Composite.add(engine.world, [ground, leftWall, rightWall]);

        Events.on(engine, 'collisionStart', (event) => {
            if (!gameActive) return;
            const pairs = event.pairs;
            for (let i = 0; i < pairs.length; i++) {
                const bodyA = pairs[i].bodyA;
                const bodyB = pairs[i].bodyB;

                if (bodyA.isObstacle || bodyB.isObstacle) continue;

                if (bodyA.emojiIndex !== undefined && bodyB.emojiIndex !== undefined) {
                    if (bodyA.emojiIndex === bodyB.emojiIndex && !bodyA.isProcessed && !bodyB.isProcessed) {
                        bodyA.isProcessed = true;
                        bodyB.isProcessed = true;

                        const idx = bodyA.emojiIndex;
                        const items = MODES[currentMode].items;
                        const midX = (bodyA.position.x + bodyB.position.x) / 2;
                        const midY = (bodyA.position.y + bodyB.position.y) / 2;

                        Composite.remove(engine.world, [bodyA, bodyB]);

                        if (idx < items.length - 1) {
                            score += items[idx].score;
                            document.getElementById('score').innerText = score;
                            createEmojiBody(midX, midY, idx + 1, true);
                        } else {
                            score += items[idx].score * 2;
                            document.getElementById('score').innerText = score;
                            createObstacleBody(midX, midY, true);
                        }
                        break;
                    }
                }
            }
        });

        Events.on(engine, 'afterUpdate', () => {
            if (!gameActive) return;
            const bodies = Composite.allBodies(engine.world);
            const now = Date.now();
            
            for (let i = 0; i < bodies.length; i++) {
                const b = bodies[i];
                if ((b.emojiIndex !== undefined || b.isObstacle) && !b.isStatic && b.isDropped) {
                    if (now - b.createdTime > 1500) {
                        if (b.position.y < DEAD_LINE && Math.abs(b.velocity.y) < 0.5) {
                            triggerGameOver();
                            break;
                        }
                    }
                }
            }
        });
    }

    function createEmojiBody(x, y, index, isDropped = false) {
        if (!gameActive || !engine) return;
        const item = MODES[currentMode].items[index];
        const body = Bodies.circle(x, y, item.radius, {
            restitution: 0.2,
            friction: 0.2,
            render: {
                sprite: {
                    texture: createCleanEmojiTexture(item.emoji, item.radius)
                }
            }
        });
        body.emojiIndex = index;
        body.isProcessed = false;
        body.isDropped = isDropped;
        body.createdTime = Date.now();
        Composite.add(engine.world, body);
        return body;
    }

    function createObstacleBody(x, y, isDropped = false) {
        if (!gameActive || !engine) return;
        const obs = MODES[currentMode].obamaItem;
        const body = Bodies.circle(x, y, obs.radius, {
            restitution: 0.4,
            friction: 0.2,
            render: {
                sprite: {
                    texture: createCleanEmojiTexture(obs.emoji, obs.radius)
                }
            }
        });
        body.isObstacle = true;
        body.isDropped = isDropped;
        body.createdTime = Date.now();
        Composite.add(engine.world, body);
        return body;
    }

    function createCleanEmojiTexture(emoji, radius) {
        const size = radius * 2;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        ctx.beginPath();
        ctx.arc(radius, radius, radius - 1, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = `${size * 0.75}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, radius, radius);

        return canvas.toDataURL();
    }

    function spawnNext() {
        if (!gameActive) return;
        currentEmojiIndex = nextEmojiIndex;
        nextEmojiIndex = Math.floor(Math.random() * 3);
        
        const items = MODES[currentMode].items;
        const currentItem = items[currentEmojiIndex];

        const diameter = currentItem.radius * 2;
        previewEl.style.width = `${diameter}px`;
        previewEl.style.height = `${diameter}px`;
        previewEl.style.fontSize = `${diameter * 0.75}px`;
        previewEl.innerText = currentItem.emoji;

        document.getElementById('next-display').innerText = items[nextEmojiIndex].emoji;
        previewEl.style.display = 'flex';
        canDrop = true;
    }

    function handlePointerStart(clientX) {
        if (!gameActive || !canDrop) return;
        isDragging = true;
        updateDropPosition(clientX);
    }

    function handlePointerMove(clientX) {
        if (!gameActive || !isDragging || !canDrop) return;
        updateDropPosition(clientX);
    }

    function handlePointerEnd() {
        if (!gameActive || !isDragging || !canDrop) return;
        isDragging = false;
        canDrop = false;
        previewEl.style.display = 'none';

        createEmojiBody(dropX, 35, currentEmojiIndex, true);

        setTimeout(() => {
            if (gameActive) spawnNext();
        }, 600);
    }

    function updateDropPosition(clientX) {
        const rect = container.getBoundingClientRect();
        let x = clientX - rect.left;
        const radius = MODES[currentMode].items[currentEmojiIndex].radius;
        
        if (x < radius) x = radius;
        if (x > WIDTH - radius) x = WIDTH - radius;
        
        dropX = x;
        previewEl.style.left = `${x}px`;
    }

    // --- ゲーム操作のイベント登録 (マウス＆タッチ両対応) ---
    container.addEventListener('mousedown', (e) => handlePointerStart(e.clientX));
    window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX));
    window.addEventListener('mouseup', () => handlePointerEnd());

    container.addEventListener('touchstart', (e) => {
        handlePointerStart(e.touches[0].clientX);
        e.preventDefault();
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
        handlePointerMove(e.touches[0].clientX);
    }, { passive: false });
    window.addEventListener('touchend', () => {
        handlePointerEnd();
    });

    // --- ボタンの確実なタッチ反応イベント登録 ---
    function bindButton(id, callback) {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('click', (e) => {
            e.preventDefault();
            callback();
        });
        el.addEventListener('touchstart', (e) => {
            e.preventDefault();
            callback();
        }, { passive: false });
    }

    bindButton('btn-office', () => startGame('office'));
    bindButton('btn-animal', () => startGame('animal'));
    bindButton('btn-giveup', () => triggerGameOver());
    bindButton('btn-restart', () => restartGame());
    bindButton('btn-share', () => shareToX());
    bindButton('btn-copy', () => copyCardText());
    bindButton('btn-title', () => returnToTitle());

    function generateResultCardText() {
        const modeName = MODES[currentMode].name;
        const bodies = Composite.allBodies(engine.world);
        const counts = {};
        const items = MODES[currentMode].items;
        const maxIdx = items.length - 1;

        bodies.forEach(b => {
            if (b.emojiIndex !== undefined) {
                const idx = b.emojiIndex;
                counts[idx] = (counts[idx] || 0) + 1;
            } else if (b.isObstacle) {
                counts[maxIdx] = (counts[maxIdx] || 0) + 2;
            }
        });

        let itemsStr = "";
        for (let i = items.length - 1; i >= 0; i--) {
            if (counts[i]) {
                itemsStr += `${items[i].emoji}×${counts[i]}  `;
            }
        }
        if (itemsStr === "") itemsStr = "なし";

        return `┌──────────────────────┐\n` +
               `📦 【絵文字ドロップ (${modeName})】\n` +
               `🏆 スコア: ${score} 点\n` +
               `----------------------\n` +
               `📊 成果:\n${itemsStr}\n` +
               `└──────────────────────┘\n` +
               `#絵文字ドロップ #EMOJIDROP`;
    }

    function triggerGameOver() {
        if (!gameActive) return;
        gameActive = false;
        isDragging = false;
        previewEl.style.display = 'none';

        document.getElementById('final-score').innerText = score;
        document.getElementById('result-title').innerText = MODES[currentMode].text || "結果発表：";

        const bodies = Composite.allBodies(engine.world);
        const counts = {};
        const items = MODES[currentMode].items;
        const maxIdx = items.length - 1;

        bodies.forEach(b => {
            if (b.emojiIndex !== undefined) {
                const idx = b.emojiIndex;
                counts[idx] = (counts[idx] => 0) + 1; // 修正
            } else if (b.isObstacle) {
                counts[maxIdx] = (counts[maxIdx] || 0) + 2;
            }
        });

        let resultHTML = '';
        for (let i = items.length - 1; i >= 0; i--) {
            if (counts[i]) {
                resultHTML += `[ ${items[i].emoji} × ${counts[i]} ] `;
            }
        }
        if (resultHTML === '') resultHTML = 'きれいさっぱり何もない…？';
        document.getElementById('result-items').innerHTML = resultHTML;

        document.getElementById('gameover-screen').classList.remove('hidden');
    }

    function shareToX() {
        const cardText = generateResultCardText();
        const text = encodeURIComponent(cardText);
        window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
    }

    function copyCardText() {
        const cardText = generateResultCardText();
        navigator.clipboard.writeText(cardText).then(() => {
            alert("リザルトカードをコピーしました！");
        }).catch(err => {
            alert("コピーに失敗しました…");
        });
    }
</script>

</body>
</html>
